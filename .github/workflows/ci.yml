name: CI

# 每次 push 到 main、或 PR：style-check 先行，通过后多路并行——
#   static-analysis（SpotBugs 门禁）、主链 unit-test → integration-test（串行）、compat-test 矩阵
# compat 矩阵在 JDK 8/11/17/21/25 原生 Temurin JDK 上跑（matrix 每腿独立 runner，无需 Docker）
# report job 等 compat 矩阵跑完，把结果聚合成 Markdown 表格（workflow Summary 页）
# 内存测量在 memory.yml、性能基准在 benchmark.yml：均 CI 全绿后自动触发（workflow_run），也可手动触发
# 构建工具链统一 JDK 21（Spotless/palantir、SpotBugs 需要），产出字节码为 Java 8（pom 里 --release 8）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  style-check:
    name: Style check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless check
        run: mvn -B spotless:check

  # 静态分析：SpotBugs 字节码级 bug 检测（与源码级检查互补，抓 equals/hashCode 不配对、
  # 默认字符集、getter 泄露内部可变引用等）。确定性分析无噪声，适合门禁：发现 bug 即红。
  # 同一份 Java 8 字节码只扫一次，compat 矩阵与 integration-test 里显式 skip。
  static-analysis:
    name: Static analysis (SpotBugs)
    needs: style-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: SpotBugs check
        run: mvn -B compile spotbugs:check

      # 报告留存：失败时可在 Artifacts 下载 XML 详情（含每个 bug 的类/行号/模式说明）
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  # 兼容性矩阵：JDK 8→25 各主版本（8/11/17/21/25）在原生 Temurin JDK 上跑全量测试（单测 + 集成测试）。
  # 不测 9/10 等非 LTS 版本：无官方 Temurin 渠道，且 Java 8 字节码在其上的行为与 11 无实质差异。
  compat-test:
    name: Compat tests (JDK ${{ matrix.java }})
    needs: style-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # 跳过 Spotless（palantir 需 JDK 21 工具链）、SpotBugs（同一份字节码由 static-analysis 统一扫）
      # 和 JaCoCo（覆盖率只由 21 的 unit/integration 阶段上传）
      - name: Run all tests
        id: tests
        run: mvn -B clean verify -Dspotless.check.skip=true -Dspotbugs.skip=true -Djacoco.skip=true | tee mvn.log

      # 机器可读结果行（pass|测试总数），供 report job 汇总成表；grep 正则末尾 $ 排除 per-class 行
      - name: Collect result
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            total=$(grep -E 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' mvn.log \
              | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' | awk '{s+=$1} END {print s}')
            echo "pass|${total:-0}" > "compat-result-jdk${{ matrix.java }}.txt"
          else
            echo "fail|0" > "compat-result-jdk${{ matrix.java }}.txt"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-result-jdk-${{ matrix.java }}
          path: compat-result-jdk${{ matrix.java }}.txt
          retention-days: 1

  unit-test:
    name: Unit tests
    needs: style-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # clean test：编译 + surefire 单元测试（*Test.java），jacoco 在 test 阶段出覆盖率报告
      - name: Unit tests
        run: mvn -B clean test

      # 公开仓库免 token；若仓库转私有需在 Settings 配 CODECOV_TOKEN
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          flags: unit

  integration-test:
    name: Integration tests
    needs: unit-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -Dsurefire.skip=true 只跳过 surefire，failsafe 集成测试（*IT.java）照常执行；
      # SpotBugs 由 static-analysis job 统一把关，这里跳过避免重复
      - name: Integration tests
        run: mvn -B clean verify -Dsurefire.skip=true -Dspotbugs.skip=true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          flags: integration

  # 汇总：把 compat-test 矩阵的散点 artifact 聚合成 Markdown 表格（workflow Summary 页）。
  # if: always()：任何腿失败也出表，缺失数据标 ❌。
  report:
    name: Compat report
    needs: [compat-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # continue-on-error：矩阵整体被跳过（如 style-check 失败）时零匹配会抛错，
      # 放行后由下方脚本的"缺数据标 ❌"降级分支兜底
      - name: Download compat results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compat-result-jdk-*
          merge-multiple: true

      - name: Build summary table
        run: |
          {
            echo "## 多 JDK 兼容测试（原生 Temurin JDK）"
            echo ""
            echo "| JDK | 结果 | 测试总数 |"
            echo "|---|---|---|"
            for v in 8 11 17 21 25; do
              f="compat-result-jdk${v}.txt"
              if [ -s "$f" ]; then
                IFS='|' read -r status total < "$f"
                [ "$status" = "pass" ] && mark="✅ 通过" || mark="❌ 失败"
                echo "| ${v} | ${mark} | ${total} |"
              else
                echo "| ${v} | ❌ 失败 | — |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

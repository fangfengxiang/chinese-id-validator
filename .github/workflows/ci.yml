name: CI

# 每次 push 到 main、或 PR，自动跑全量测试 + 内存探针
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify (unit + integration tests)
        run: mvn -B clean verify

  memory-probe:
    name: Memory probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compile main project
        run: mvn -B compile

      - name: Compile memory probe
        run: |
          mkdir -p test/out
          javac -cp target/classes -d test/out test/MemoryProbe.java

      - name: Run memory probe
        run: |
          java -Xmx128m -cp target/classes:test/out MemoryProbe all | tee probe-output.txt

      - name: Publish to step summary
        if: always()
        run: |
          {
            echo "## 数据内存占用"
            echo ""
            echo "> 每次 push / PR 自动测量，环境：ubuntu-24.04 + Temurin JRE 11 + \`-Xmx128m\`"
            echo ""
            echo '```'
            cat probe-output.txt 2>/dev/null || echo "(探针输出不可用，请检查前序步骤)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
